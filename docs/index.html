<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(59,130,246,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 50%, rgba(139,92,246,0.08) 0%, transparent 50%);
      z-index: 0;
    }
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(255,255,255,0.15); border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; } 90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .box { position: relative; z-index: 1; text-align: center; animation: fadeInUp 0.8s ease; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(59,130,246,0.3); }
      50% { text-shadow: 0 0 40px rgba(59,130,246,0.6); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); }
      50% { box-shadow: 0 0 0 10px rgba(59,130,246,0); }
    }
    .title {
      font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem;
      animation: glow 3s ease-in-out infinite; letter-spacing: -1px;
    }
    .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 2.5rem; animation: fadeInUp 0.8s ease 0.2s both; }
    .code-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
    .code-row input {
      width: 56px; height: 64px; text-align: center; font-size: 1.6rem; font-weight: 600;
      background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #fff; transition: all 0.3s ease;
      animation: fadeInUp 0.8s ease calc(0.1s * var(--i)) both;
    }
    .code-row input:focus {
      outline: none; border-color: #3b82f6; background: rgba(59,130,246,0.1);
      transform: translateY(-3px); box-shadow: 0 8px 25px rgba(59,130,246,0.2);
    }
    .code-row input.filled { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.08); }
    .code-row input.shake { animation: shake 0.5s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); } 60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .enter-btn {
      padding: 0.9rem 3rem; font-size: 0.95rem; font-weight: 600;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
      border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
      text-transform: uppercase; letter-spacing: 3px; animation: fadeInUp 0.8s ease 0.7s both;
    }
    .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.4); }
    .enter-btn:active { transform: translateY(0); }
    .enter-btn.pulse { animation: pulse 1s ease; }
    .error-msg { color: #ef4444; margin-top: 1rem; font-size: 0.85rem; min-height: 1.2rem; }
    .footer-text { position: fixed; bottom: 2rem; color: #333; font-size: 0.75rem; animation: fadeInUp 0.8s ease 1s both; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>
  <div class="box">
    <div class="title">StudyHub</div>
    <div class="subtitle">Create your access code</div>
    <div class="code-row">
      <input type="text" maxlength="1" id="d1" style="--i:1" autofocus>
      <input type="text" maxlength="1" id="d2" style="--i:2">
      <input type="text" maxlength="1" id="d3" style="--i:3">
      <input type="text" maxlength="1" id="d4" style="--i:4">
      <input type="text" maxlength="1" id="d5" style="--i:5">
      <input type="text" maxlength="1" id="d6" style="--i:6">
    </div>
    <button class="enter-btn" onclick="go()">Enter</button>
    <div class="error-msg" id="err"></div>
  </div>
  <div class="footer-text">Student Portal v2.0</div>

  <script>
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      particlesEl.appendChild(p);
    }

    const inputs = document.querySelectorAll('.code-row input');
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        if (inp.value) { inp.classList.add('filled'); if (i < 5) inputs[i+1].focus(); }
        else inp.classList.remove('filled');
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i-1].focus(); inputs[i-1].value = ''; inputs[i-1].classList.remove('filled'); }
        if (e.key === 'Enter') go();
      });
      inp.addEventListener('paste', e => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (/^\d{6}$/.test(paste)) { for (let j = 0; j < 6; j++) { inputs[j].value = paste[j]; inputs[j].classList.add('filled'); } inputs[5].focus(); }
      });
    });

    function go() {
      let c = ''; inputs.forEach(i => c += i.value);
      const err = document.getElementById('err');
      if (c.length !== 6) {
        err.textContent = 'Enter all 6 digits';
        inputs.forEach(i => { if (!i.value) i.classList.add('shake'); });
        setTimeout(() => inputs.forEach(i => i.classList.remove('shake')), 500);
        return;
      }
      document.querySelector('.enter-btn').classList.add('pulse');
      setTimeout(() => { window.location.href = '/GamesStop_Online/profile.html?code=' + c; }, 400);
    }
  </script>
</body>
</html>
